name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hijunaid.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Add IndexNow ownership key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$INDEXNOW_KEY"
          printf '%s' "$INDEXNOW_KEY" > "dist/${INDEXNOW_KEY}.txt"

      - name: Configure deployment access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync --archive --compress --delete --delay-updates \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            dist/ "$VPS_USER@$VPS_HOST:/opt/hijunaid/dist/"
          rsync --archive --inplace \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            deploy/nginx.conf "$VPS_USER@$VPS_HOST:/opt/hijunaid/nginx.conf"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/reload-hijunaid-nginx"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          headers="$RUNNER_TEMP/production-headers.txt"
          www_headers="$RUNNER_TEMP/production-www-headers.txt"
          homepage="$RUNNER_TEMP/production-homepage.html"
          about="$RUNNER_TEMP/production-about.html"
          notes="$RUNNER_TEMP/production-notes.html"
          startup_note="$RUNNER_TEMP/production-startup-note.html"
          not_found="$RUNNER_TEMP/production-404.html"
          feed="$RUNNER_TEMP/production-rss.xml"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --dump-header "$headers" \
            --output "$homepage" \
            https://hijunaid.com/
          grep --ignore-case --quiet '^x-content-type-options: nosniff' "$headers"
          grep --ignore-case --quiet '^x-frame-options: DENY' "$headers"
          grep --ignore-case --quiet '^strict-transport-security: max-age=31536000; includeSubDomains' "$headers"
          grep --ignore-case --quiet '^content-security-policy:' "$headers"
          grep --fixed-strings --quiet '"@type":"ProfilePage"' "$homepage"
          grep --fixed-strings --quiet '"@id":"https://hijunaid.com/#junaid-hussnain"' "$homepage"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$about" \
            https://hijunaid.com/about
          grep --fixed-strings --quiet '<title>About Junaid Hussnain — Software Engineer</title>' "$about"
          grep --fixed-strings --quiet '<link rel="canonical" href="https://hijunaid.com/about">' "$about"
          grep --fixed-strings --quiet '"@id":"https://hijunaid.com/about#profile-page"' "$about"
          grep --fixed-strings --quiet 'Rector: Safe Constructor Default Inlining' "$about"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$notes" \
            https://hijunaid.com/blog
          grep --fixed-strings --quiet '"@type":"CollectionPage"' "$notes"
          grep --fixed-strings --quiet '"@type":"ItemList"' "$notes"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$startup_note" \
            https://hijunaid.com/blog/blazingly-fast-tech-stack-for-million-dollar-project
          grep --fixed-strings --quiet '<title>Choosing a Startup Stack by Constraints, Not Hype — Junaid Hussnain</title>' "$startup_note"
          grep --fixed-strings --quiet '"dateModified":"2026-08-04"' "$startup_note"
          not_found_status="$(curl --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$not_found" \
            --write-out '%{http_code}' \
            https://hijunaid.com/deployment-check/this-page-does-not-exist)"
          test "$not_found_status" = "404"
          grep --fixed-strings --quiet '<title>Page not found — Junaid Hussnain</title>' "$not_found"
          grep --fixed-strings --quiet '<meta name="robots" content="noindex, follow">' "$not_found"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$feed" \
            https://hijunaid.com/rss.xml
          grep --fixed-strings --quiet '<dc:creator>Junaid Hussnain</dc:creator>' "$feed"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "www.hijunaid.com:443:$VPS_HOST" \
            --dump-header "$www_headers" \
            --output /dev/null \
            'https://www.hijunaid.com/blog?source=www'
          grep --extended-regexp --quiet '^HTTP/[0-9.]+ 308' "$www_headers"
          grep --ignore-case --fixed-strings --quiet \
            'location: https://hijunaid.com/blog?source=www' "$www_headers"

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node scripts/create-indexnow-payload.mjs
          curl --fail-with-body --silent --show-error --retry 3 \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$RUNNER_TEMP/indexnow.json" \
            https://api.indexnow.org/indexnow
