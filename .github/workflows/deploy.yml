name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hijunaid.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Add IndexNow ownership key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$INDEXNOW_KEY"
          printf '%s' "$INDEXNOW_KEY" > "dist/${INDEXNOW_KEY}.txt"

      - name: Configure deployment access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync --archive --compress --delete --delay-updates \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            dist/ "$VPS_USER@$VPS_HOST:/opt/hijunaid/dist/"
          rsync --archive --inplace \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            deploy/nginx.conf "$VPS_USER@$VPS_HOST:/opt/hijunaid/nginx.conf"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/reload-hijunaid-nginx"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          headers="$RUNNER_TEMP/production-headers.txt"
          homepage="$RUNNER_TEMP/production-homepage.html"
          feed="$RUNNER_TEMP/production-rss.xml"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --dump-header "$headers" \
            --output "$homepage" \
            https://hijunaid.com/
          grep --ignore-case --quiet '^x-content-type-options: nosniff' "$headers"
          grep --ignore-case --quiet '^x-frame-options: DENY' "$headers"
          grep --ignore-case --quiet '^strict-transport-security: max-age=31536000; includeSubDomains' "$headers"
          grep --ignore-case --quiet '^content-security-policy:' "$headers"
          grep --fixed-strings --quiet '"@type":"ProfilePage"' "$homepage"
          grep --fixed-strings --quiet '"@id":"https://hijunaid.com/#junaid-hussnain"' "$homepage"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "hijunaid.com:443:$VPS_HOST" \
            --output "$feed" \
            https://hijunaid.com/rss.xml
          grep --fixed-strings --quiet '<dc:creator>Junaid Hussnain</dc:creator>' "$feed"

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node scripts/create-indexnow-payload.mjs
          curl --fail-with-body --silent --show-error --retry 3 \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$RUNNER_TEMP/indexnow.json" \
            https://api.indexnow.org/indexnow
