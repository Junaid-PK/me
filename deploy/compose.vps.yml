services:
  site:
    image: nginx:alpine
    container_name: hijunaid-site
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ingress

networks:
  ingress:
    external: true
    name: robo-at-support-vps_private
